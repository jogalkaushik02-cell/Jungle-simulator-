name: Build Stillwild APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.6.3
  EXPORT_NAME: Stillwild

jobs:
  export-android:
    name: Export Android APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.6.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot config + export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          if [ -d /root/.config/godot ]; then cp -r /root/.config/godot ~/.config/godot; fi
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Point preset at the image debug keystore
        run: |
          sed -i 's@keystore/debug=".*"@keystore/debug="/root/debug.keystore"@g' export_presets.cfg
          sed -i 's@keystore/debug_user=".*"@keystore/debug_user="androiddebugkey"@g' export_presets.cfg
          sed -i 's@keystore/debug_password=".*"@keystore/debug_password="android"@g' export_presets.cfg
          echo "----- preset keystore lines -----"
          grep -n 'keystore/debug' export_presets.cfg
          echo "----- sdk lines -----"
          grep -n 'sdk' export_presets.cfg

      - name: Import project once
        run: |
          godot --headless --editor --quit-after 200 || true

      - name: Android Build
        run: |
          mkdir -v -p build/android
          godot --headless --verbose --export-debug "Android" "build/android/${EXPORT_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Stillwild-APK
          path: build/android/Stillwild.apk
          if-no-files-found: error
